name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: vercel-production-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  wait-for-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Skip wait on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual deployment dispatch skips waiting for a push CI run."

      - name: Wait for Continuous Integration
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_NAME: Continuous Integration
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            status=$(
              gh run list \
                --repo "$REPOSITORY" \
                --workflow "$WORKFLOW_NAME" \
                --commit "$HEAD_SHA" \
                --event push \
                --limit 1 \
                --json status \
                --jq '.[0].status // ""'
            )

            if [ -z "$status" ]; then
              echo "Continuous Integration run is not available yet. Attempt $attempt/60."
              sleep 10
              continue
            fi

            conclusion=$(
              gh run list \
                --repo "$REPOSITORY" \
                --workflow "$WORKFLOW_NAME" \
                --commit "$HEAD_SHA" \
                --event push \
                --limit 1 \
                --json conclusion \
                --jq '.[0].conclusion // ""'
            )
            url=$(
              gh run list \
                --repo "$REPOSITORY" \
                --workflow "$WORKFLOW_NAME" \
                --commit "$HEAD_SHA" \
                --event push \
                --limit 1 \
                --json url \
                --jq '.[0].url // ""'
            )

            echo "Continuous Integration status: $status, conclusion: ${conclusion:-pending}"
            echo "Continuous Integration URL: $url"

            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
              exit 0
            fi

            if [ "$status" = "completed" ]; then
              echo "Continuous Integration finished with conclusion: $conclusion"
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for Continuous Integration to finish."
          exit 1

  deploy-to-vercel:
    needs: wait-for-ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit and component tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
